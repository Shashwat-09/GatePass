name: gatepass_organiser
description: "GatePass Organiser — check-in, sales and tools for organisers and gate staff."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gatepass_ui:
    path: ../packages/gatepass_ui

  get: ^4.6.6
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  mobile_scanner: ^7.0.0
  cryptography: ^2.7.0
  crypto: ^3.0.5
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#1C1C1E"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 23
