name: gatepass_b2b
description: "GatePass B2B: distributor prices, sellers, orders and books."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gatepass_ui:
    path: ../packages/gatepass_ui
  gatepass_staff:
    path: ../packages/gatepass_staff

  get: ^4.6.6
  http: ^1.2.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  qr_flutter: ^4.1.0
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#B45309"
  adaptive_icon_foreground: assets/icon_foreground.png
  min_sdk_android: 23
