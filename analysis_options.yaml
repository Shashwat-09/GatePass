include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - reverse-engineering/**
    - backend/**
    - build/**
    - android/**
    - ios/**
    # Analyzed on their own (own pubspec): flutter analyze in vendor/, b2b/ and packages/*
    - vendor/**
    - b2b/**
    - packages/**

linter:
  rules:
    prefer_const_constructors: true
    avoid_print: true
