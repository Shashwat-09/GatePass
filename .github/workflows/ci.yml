name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, tests, build, image)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: eventa
          POSTGRES_DB: eventa_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - name: Tests (unit + e2e against Postgres/Redis)
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:eventa@localhost:5433/eventa_test
          TEST_REDIS_URL: redis://localhost:6379
      - run: npm run build
      - name: Docker image builds
        run: docker build -t gatepass-api:ci .

  client:
    name: Flutter (analyze, test, release APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Release APK (unsigned upload key in CI; size budget 40 MB)
        run: |
          flutter build apk --release --split-per-abi --dart-define=BASE_URL=https://api.staging.example.org/
          size=$(stat -c %s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk)
          echo "arm64 APK: $((size / 1024 / 1024)) MB"
          test "$size" -lt $((40 * 1024 * 1024))
      - uses: actions/upload-artifact@v4
        with:
          name: apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 7
