name: iOS

# Builds both iOS apps on a macOS runner (no Mac needed locally).
#  * Always: an unsigned release build of each app — proves it compiles,
#    links its CocoaPods and fits the size budget.
#  * When the App Store Connect secrets below are set: a signed archive of
#    each app uploaded to TestFlight. See docs/RELEASE.md §iOS.
#      APPLE_TEAM_ID          10-character Team ID
#      ASC_KEY_ID             App Store Connect API key ID
#      ASC_ISSUER_ID          its issuer ID
#      ASC_KEY_P8             the .p8 key file contents
#      IOS_BASE_URL           https API base URL baked into TestFlight builds

# Mac minutes cost 10× on GitHub, so iOS builds only run when asked: change
# .github/ios-build.txt and push (or "Run workflow" on the default branch).
on:
  workflow_dispatch:
  push:
    branches: [main, release-readiness]
    paths: ['.github/ios-build.txt']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GatePass (customer)
            dir: .
            artifact: gatepass-ios
            demo_defines: --dart-define=USE_MOCK=true --dart-define=PHASE2=true --dart-define=BASE_URL=https://api.staging.example.org/
          - name: GatePass Organiser
            dir: vendor
            artifact: gatepass-organiser-ios
            demo_defines: --dart-define=USE_MOCK=true
          - name: GatePass B2B
            dir: b2b
            artifact: gatepass-b2b-ios
            demo_defines: --dart-define=USE_MOCK=true
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    env:
      HAS_SIGNING: ${{ secrets.ASC_KEY_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      # API address: the IOS_BASE_URL secret, else the Google Cloud server from deploy/gcp/project.env.
      - name: API address
        working-directory: .
        env:
          IOS_BASE_URL: ${{ secrets.IOS_BASE_URL }}
        run: |
          if [ -n "$IOS_BASE_URL" ]; then u="$IOS_BASE_URL"
          elif [ -f deploy/gcp/project.env ]; then . deploy/gcp/project.env; u="https://gatepass-api-${GCP_PROJECT_NUMBER}.${GCP_REGION}.run.app/"
          else u="https://api.staging.example.org/"; fi
          echo "BASE_URL=$u" >> "$GITHUB_ENV"; echo "API: $u"
      # Firebase's iOS SDK (Swift Package) needs the Xcode 26 toolchain: use the newest Xcode on the image.
      - name: Select newest Xcode
        working-directory: .
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Unsigned release build
        run: flutter build ios --release --no-codesign --dart-define=BASE_URL=$BASE_URL
      - name: Package unsigned .ipa (live server; install with Sideloadly / AltStore, which re-sign it)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ${{ matrix.artifact }}-unsigned.ipa Payload
          du -h ${{ matrix.artifact }}-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-unsigned
          path: ${{ matrix.dir }}/${{ matrix.artifact }}-unsigned.ipa
          retention-days: 30

      # Demo build: built-in sample data, no server needed. For sideloading onto
      # your own iPhone with a free Apple ID (Sideloadly / AltStore re-sign it).
      - name: Demo build (sample data) for sideloading
        run: |
          flutter build ios --release --no-codesign ${{ matrix.demo_defines }}
          rm -rf Payload && mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr ${{ matrix.artifact }}-demo.ipa Payload
          du -h ${{ matrix.artifact }}-demo.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-demo
          path: ${{ matrix.dir }}/${{ matrix.artifact }}-demo.ipa
          retention-days: 30

      # ── TestFlight (only when the secrets exist) ──
      - name: App Store Connect key
        if: env.HAS_SIGNING == 'true'
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
      - name: Archive (automatic signing via the API key)
        if: env.HAS_SIGNING == 'true'
        run: |
          flutter build ios --release --config-only --build-number=${{ github.run_number }} --dart-define=BASE_URL=$BASE_URL
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -archivePath build/Runner.xcarchive -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }} \
            archive
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true'
        run: |
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

  # Every push: the three unsigned IPAs go on the private "ios-test" pre-release.
  publish:
    name: Publish test IPAs
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-unsigned'
          merge-multiple: true
      - name: Upload to the ios-test pre-release
        run: |
          mv gatepass-ios-unsigned.ipa GatePass.ipa
          mv gatepass-organiser-ios-unsigned.ipa GatePass-Organiser.ipa
          mv gatepass-b2b-ios-unsigned.ipa GatePass-B2B.ipa
          gh release view ios-test -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create ios-test -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" --title "iOS test builds" --notes "Unsigned IPAs."
          gh release upload ios-test GatePass.ipa GatePass-Organiser.ipa GatePass-B2B.ipa -R "$GITHUB_REPOSITORY" --clobber
          gh release edit ios-test -R "$GITHUB_REPOSITORY" --notes "Unsigned IPAs from commit ${GITHUB_SHA::7}, pointed at the live test server. Install with Sideloadly or AltStore."
