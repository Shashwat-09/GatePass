name: gatepass_staff
description: "Shared code for the GatePass staff apps (Organiser and B2B): API client, sign-in, account, models."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  gatepass_ui:
    path: ../gatepass_ui
  get: ^4.6.6
  http: ^1.2.2
  http_parser: ^4.1.2
  file_picker: ^13.3.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  cryptography: ^2.7.0
  crypto: ^3.0.5
  intl: ^0.19.0
  pin_code_fields: ^8.0.1
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
