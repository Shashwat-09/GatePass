name: gatepass
description: "GatePass — live-events ticketing app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State / routing / DI
  get: ^4.6.6
  get_it: ^7.7.0

  # Networking
  http: ^1.2.2
  connectivity_plus: ^6.0.5

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # UI
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  smooth_page_indicator: ^1.2.0+3
  pin_code_fields: ^8.0.1
  carousel_slider: ^5.0.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.2.0
  razorpay_flutter: ^1.4.7
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  firebase_analytics: ^13.0.1
  share_plus: ^13.3.1
  app_links: ^7.2.2
  add_2_calendar: ^3.1.1
  geolocator: ^14.1.2
  flutter_native_contact_picker: ^0.0.13
  file_picker: ^13.3.2
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Placeholder brand assets (assets/brand) — replace with final artwork, then run:
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#6C4DF6"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 23

flutter_native_splash:
  color: "#6C4DF6"
  image: assets/brand/splash.png
  android_12:
    color: "#6C4DF6"
    image: assets/brand/splash.png
